DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
    # BATCH_SIZE: 16
    # BATCH_SIZE: 8
  TEST:
    BATCH_SIZE: 500
  NUM_WORKERS: 8
  # K_TRANSFORMS: 2

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  # TRANSFORMS: ["randaugment", "normalize"]
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "adam"
  # LR: 0.005    #output5
  LR: 0.0025    #best now
  # LR: 0.0028  
  # LR: 0.0005
  MAX_EPOCH: 50
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5
  EPS: 1e-3

TRAIN:
  PRINT_FREQ: 5

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  COOP:
    CTX_INIT: False
